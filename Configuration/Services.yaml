services:

  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  SchamsNet\NagiosExtensionlist\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  cache.nagios_extensionlist:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['nagios_extensionlist']

  SchamsNet\NagiosExtensionlist\Service\Typo3CoreVersionService:
    public: true
    arguments:
      $cache: '@cache.nagios_extensionlist'

  SchamsNet\NagiosExtensionlist\Command\WriteConfigurationFileCommand:
    tags:
      - name: 'console.command'
        command: 'nagios_extensionlist:write'
        description: 'Fetches the generated Nagios configuration and stores it as static file (default: fileadmin/nagios/check_typo3.cfg)'
        schedulable: true
